name: Linux and Windows
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install FFmpeg and fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core xvfb
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - name: Open all GUI tabs (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py
      - name: Open all GUI tabs (Windows)
        if: runner.os == 'Windows'
        run: python tests/gui_smoke.py
